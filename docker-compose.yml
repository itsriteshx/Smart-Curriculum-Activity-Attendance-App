version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: agri_advisor_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agri_network

  # Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_advisor_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smart_agriculture_db
      - JWT_SECRET=supersecret_agri_advisor_jwt_key_2026_dev_secure
      - JWT_EXPIRE=7d
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-demo_openweather_key}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - agri_network

  # Frontend Web UI Service (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri_advisor_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agri_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  agri_network:
    driver: bridge
